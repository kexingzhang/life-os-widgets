<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LIFE OS · 每日进度热力图</title>
<style>
  :root {
    --bg:#fff;
    --ink:#27333d;
    --muted:#84909c;
    --edge:#e9edf0;
    --rail:#edf1f3;
    --blue:#7b9cbe;
    --lv0:#e5ebef;
    --lv1:#e0e9f2;
    --lv2:#c5d6e6;
    --lv3:#a0bbd5;
    --lv4:#7b9cbe;
    --lv5:#5e83ab;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  html { width:100%; }
  body { width:100%; }
  .panel { width:100%; background:var(--bg); border:1px solid var(--edge); border-radius:16px; padding:15px 17px 13px; }
  .head,.title-row,.footer { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand { display:inline-flex; align-items:center; min-width:0; white-space:nowrap; font-size:12px; font-weight:700; letter-spacing:.06em; }
  .dot { flex:0 0 auto; display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:#8fbca4; box-shadow:0 0 0 3px #8fbca422; }
  .period,.substatus { font-size:10px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .title-row { margin:11px 0 10px; align-items:baseline; }
  .title-row h2 { margin:0; font-size:19px; line-height:1.12; letter-spacing:-.02em; font-weight:740; }
  .switch { display:flex; gap:7px; margin:0 0 10px; }
  .switch button { appearance:none; border:1px solid var(--edge); background:var(--bg); color:var(--muted); border-radius:99px; padding:5px 12px; font:630 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; cursor:pointer; }
  .switch button.active { background:#edf3f6; color:#476d8d; border-color:#dce6ed; }
  .switch button:focus-visible,.cell:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .heatmap { display:flex; align-items:stretch; gap:9px; width:100%; }
  .weekdays { flex:0 0 19px; height:110px; display:grid; grid-template-rows:repeat(7,minmax(0,1fr)); gap:3px; align-items:center; font-size:10px; color:var(--muted); }
  .cells { flex:1; min-width:0; height:110px; display:grid; grid-auto-flow:column; grid-template-columns:repeat(13,minmax(0,1fr)); grid-template-rows:repeat(7,minmax(0,1fr)); gap:3px; }
  .cell { display:block; min-width:0; border-radius:3px; border:1px solid var(--edge); background:var(--rail); cursor:default; }
  .cell.missing { background:linear-gradient(135deg,#f4f6f8 47%,#e7edf1 49%,#e7edf1 51%,#f4f6f8 53%); }
  .cell.future { background:var(--rail); opacity:.25; }
  .cell.lv0 { background:var(--lv0); border-color:var(--lv0); }
  .cell.lv1 { background:var(--lv1); border-color:var(--lv1); }
  .cell.lv2 { background:var(--lv2); border-color:var(--lv2); }
  .cell.lv3 { background:var(--lv3); border-color:var(--lv3); }
  .cell.lv4 { background:var(--lv4); border-color:var(--lv4); }
  .cell.lv5 { background:var(--lv5); border-color:var(--lv5); }
  .cell.today { outline:1px solid #a3bacb; outline-offset:1px; }
  .months { display:grid; grid-template-columns:repeat(13,minmax(0,1fr)); gap:3px; margin:6px 0 0 28px; height:13px; color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }
  .months span { white-space:nowrap; }
  .footer { color:var(--muted); font-size:9px; padding-top:10px; margin-top:11px; border-top:1px solid var(--edge); }
  .footer-label { white-space:nowrap; }
  .legend { display:flex; align-items:center; gap:4px; white-space:nowrap; font-size:9px; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; }
  .swatch.s1 { background:var(--lv1); }.swatch.s2 { background:var(--lv2); }.swatch.s3 { background:var(--lv3); }.swatch.s4 { background:var(--lv4); }.swatch.s5 { background:var(--lv5); }
  @media(max-width:340px) {
    .panel { padding:13px 13px 12px; }
    .title-row h2 { font-size:18px; }
    .cells { gap:2px; }.months { gap:2px; }
    .heatmap { gap:7px; }.months { margin-left:26px; }
    .footer { font-size:9px; }.legend { gap:3px; }.swatch { width:9px; height:9px; }
  }
  @media(prefers-color-scheme:dark) {
    :root { --bg:#212328; --ink:#f1f2f3; --muted:#aaaeb7; --edge:#3a3e48; --rail:#343841; --lv0:#444d58; --lv1:#43566b; --lv2:#506b85; --lv3:#6585a6; --lv4:#7b9cbe; --lv5:#a0bbd5; }
    .switch button.active { background:#303c49; color:#b2cbe2; border-color:#486075; }
    .cell.missing { background:linear-gradient(135deg,#282c33 47%,#343a43 49%,#343a43 51%,#282c33 53%); }
    .cell.today { outline-color:#a0bbd5; }
  }
</style>
</head>
<body>
<section class="panel" aria-label="LIFE OS 每日进度热力图">
  <div class="head">
    <span class="brand"><i class="dot" aria-hidden="true"></i>DAILY · 每日进度</span>
    <span class="period" id="period">近 13 周</span>
  </div>
  <div class="title-row">
    <h2>进度热力图</h2>
    <span class="substatus" id="status" aria-live="polite">待接入数据</span>
  </div>
  <div class="switch" role="tablist" aria-label="选择记录人">
    <button type="button" class="active" role="tab" aria-selected="true" data-person="星宝">星宝</button>
    <button type="button" role="tab" aria-selected="false" data-person="溪宝">溪宝</button>
  </div>
  <div class="heatmap">
    <div class="weekdays" aria-hidden="true"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
    <div class="cells" id="heat" role="grid" aria-label="近 13 周的每日计划完成率"></div>
  </div>
  <div class="months" id="months" aria-hidden="true"></div>
  <div class="footer">
    <span class="footer-label">DAILY · 目标完成率</span>
    <span class="legend" aria-label="颜色越深完成率越高"><span>低</span><i class="swatch s1"></i><i class="swatch s2"></i><i class="swatch s3"></i><i class="swatch s4"></i><i class="swatch s5"></i><span>高</span></span>
  </div>
</section>
<script>
/*
 * LIFE OS · 公开前端框架。Grok Bot 后续可配置安全的数据接入。
 * 不要将 Notion Token、API 密钥或私人生活记录上传至公开 GitHub 仓库。
 * 数据契约示例：{date:"2026-10-12",person:"星宝",rate:0.58,study:0.25,exercise:1,water:0.5}
 * rate: 0 至 1；真实 0% 为 rate:0；没有记录的日期不提供该项。
 * 可按学习、运动和喝水目标完成率等权平均，不含月度减重/支出。
 *
 * 数据文件：同目录 ./data.json，格式 {"updated":"2026-10-12T12:00:00+08:00","records":[ ...上述契约对象... ]}
 * 仅含 date / person / rate(0-1) 及可选 study / exercise / water(0-1 完成率)；
 * 不得含分钟数、杯数、金额、体重、备注或任何 Notion 链接/ID/凭据。
 * 读取失败时静默保持“待接入数据”。
 */
let DATA = [];
const people = ["星宝", "溪宝"];
let person = people[0];
const formatter = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Shanghai", year:"numeric", month:"2-digit", day:"2-digit"});
function shDate(date) {
  const p=Object.fromEntries(formatter.formatToParts(date).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));
  return p.year+"-"+p.month+"-"+p.day;
}
function utcDate(str) { return new Date(str+"T00:00:00Z"); }
function isoDate(date) { return date.toISOString().slice(0,10); }
function level(value) {
  if (value===0) return 0;
  if (value<.25) return 1;
  if (value<.5) return 2;
  if (value<.75) return 3;
  if (value<1) return 4;
  return 5;
}
let localToday="";
function draw() {
  localToday=shDate(new Date());
  const today=utcDate(localToday);
  const monday=new Date(today);
  monday.setUTCDate(monday.getUTCDate()-((monday.getUTCDay()+6)%7)-12*7);
  const heat=document.getElementById("heat");
  const months=document.getElementById("months");
  heat.replaceChildren(); months.replaceChildren();
  const matches=DATA.filter(x=>x.person===person&&typeof x.date==="string");
  const byDate=new Map(matches.map(x=>[x.date,x]));
  for(let w=0;w<13;w++) {
    const weekDate=new Date(monday);weekDate.setUTCDate(weekDate.getUTCDate()+w*7);
    const month=document.createElement("span");
    const previous=new Date(weekDate);previous.setUTCDate(previous.getUTCDate()-7);
    month.textContent=(w===0 || weekDate.getUTCMonth()!==previous.getUTCMonth())?(weekDate.getUTCMonth()+1)+"月":"";
    months.appendChild(month);
    for(let day=0;day<7;day++) {
      const d=new Date(weekDate);d.setUTCDate(d.getUTCDate()+day);
      const date=isoDate(d),record=byDate.get(date),cell=document.createElement("span");
      const hasRate=!!record&&typeof record.rate==="number"&&Number.isFinite(record.rate);
      const rate=hasRate?Math.max(0,Math.min(1,record.rate)):null;
      cell.className="cell "+(d>today?"future":hasRate?"lv"+level(rate):"missing")+(date===localToday?" today":"");
      const info=date+" · "+person+" · "+(d>today?"尚未到来":hasRate?"完成 "+Math.round(rate*100)+"%":"未记录");
      cell.title=info;cell.setAttribute("aria-label",info);cell.setAttribute("role","gridcell");cell.tabIndex=0;
      heat.appendChild(cell);
    }
  }
  const start=isoDate(monday);
  const count=matches.filter(x=>x.date>=start&&x.date<=localToday&&typeof x.rate==="number"&&Number.isFinite(x.rate)).length;
  document.getElementById("status").textContent=count?"已记录 "+count+" 天":"待接入数据";
  document.getElementById("period").textContent="近 13 周";
}
document.querySelectorAll(".switch button").forEach(button=>button.addEventListener("click",()=>{
  person=button.dataset.person;
  document.querySelectorAll(".switch button").forEach(b=>{
    const active=b===button;
    b.classList.toggle("active",active);
    b.setAttribute("aria-selected",String(active));
  });
  draw();
}));
draw();
fetch("./data.json?t="+Date.now(),{cache:"no-store"})
  .then(r=>r.ok?r.json():Promise.reject())
  .then(j=>{ if(j&&Array.isArray(j.records)){ DATA=j.records; draw(); } })
  .catch(()=>{});
setInterval(()=>{ if(shDate(new Date())!==localToday) draw(); },60000);
</script>
</body>
</html>
