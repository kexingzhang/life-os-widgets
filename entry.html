<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;justify-content:center;align-items:center;min-height:216px;padding:8px 10px;overflow:hidden}
.grid{width:100%;max-width:430px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-items:stretch}
.card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0;min-height:66px;padding:0 10px 0 14px;border:1px solid rgba(95,90,85,.07);border-radius:12px;background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer;transition:filter .15s ease,transform .15s ease,box-shadow .15s ease;overflow:hidden}
.card span{position:relative;z-index:1;white-space:nowrap;font-size:15px;letter-spacing:.01em;font-weight:600}
.card svg{width:43px;height:43px;flex:none;color:var(--stroke);opacity:.82}
.card:focus-visible{outline:2px solid var(--stroke);outline-offset:2px}
.card:hover{transform:translateY(-1px);filter:saturate(1.08);box-shadow:0 4px 12px rgba(40,36,30,.09)}
@media(max-width:370px){.grid{gap:8px}.card{min-height:62px;padding-left:11px;padding-right:8px;border-radius:10px}.card span{font-size:13px}.card svg{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
